name: Verify delivered Windows desktop DOCX
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: desktop-0.17.9-windows-x86_64
          run-id: 38201487334
          github-token: ${{ github.token }}
          path: delivery
      - run: python -m pip install python-docx==1.2.0
      - run: python packaging/nuitka/verify_windows_desktop.py --delivery delivery --output evidence
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-docx-acceptance
          path: |
            evidence/docx-acceptance.json
            evidence/source.docx
            evidence/converted.docx
            evidence/report.json
          if-no-files-found: error
