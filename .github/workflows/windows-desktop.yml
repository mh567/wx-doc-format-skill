name: Windows x86_64 desktop
on:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: engine
          ref: 77f0c2942bba50279bc4d4e773c9ebb43e71c926
      - uses: actions/checkout@v4
        with:
          repository: mh567/wx-doc-format-desktop
          ref: 468e627c70e1157a8ca4bf8cf5e704f6166dd89b
          path: desktop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install locked build dependencies
        run: python -m pip install -r engine/packaging/nuitka/requirements-runtime.txt -r engine/packaging/nuitka/requirements-build.txt
      - name: Test Windows conversion engine
        run: python -m pytest engine/tests/test_modular_caption_sequence.py engine/tests/test_format_contract.py engine/tests/test_modular_file_protocol.py -q -k "not test_later_request_append_detects_change_immediately_before_replace"
      - name: Compile verified standalone runtime
        run: >-
          python -c "import sys; from pathlib import Path; sys.path.insert(0, str(Path('engine/packaging/nuitka').resolve())); import build_distribution as b; original=b.nuitka_command; b.nuitka_command=lambda path: original(path)+['--lto=no']; b.compile_standalone(Path('engine/build/nuitka/windows-desktop').resolve())"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-intermediate
          path: |
            engine/build/nuitka/windows-desktop/release_entrypoint.dist
            engine/build/nuitka/windows-desktop/compilation-report.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and verify desktop archive
        run: python packaging/nuitka/build_windows_desktop.py --engine engine --desktop desktop --output delivery
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-0.17.9-windows-x86_64
          path: |
            delivery/wx-doc-format-0.17.9-windows-x86_64.zip
            delivery/SHA256SUMS.txt
            delivery/acceptance.json
          if-no-files-found: error
          retention-days: 14
