name: Windows x86_64 desktop
on:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: engine
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: mh567/wx-doc-format-desktop
          ref: 468e627c70e1157a8ca4bf8cf5e704f6166dd89b
          path: desktop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install locked build dependencies
        run: python -m pip install -r engine/packaging/nuitka/requirements-runtime.txt -r engine/packaging/nuitka/requirements-build.txt
      - name: Test Windows conversion engine
        run: python -m pytest engine/tests -q --ignore=engine/tests/test_t09_compiled_acceptance.py --ignore=engine/tests/test_modular_distribution.py --ignore=engine/tests/test_nuitka_distribution.py --ignore=engine/tests/test_t07_public_contract.py --ignore=engine/tests/test_native_skill_cutover.py -k "not test_source_store_opens_source_once_and_resolves_declared_parts and not test_bundle_recovery_rejects_win32_control_and_logical_aliases and not test_later_request_append_detects_change_immediately_before_replace"
      - name: Compile verified standalone runtime
        run: python engine/packaging/nuitka/build_distribution.py --build-dir engine/build/windows-desktop --platform-id windows-x86_64 --compile-only
      - name: Build and verify desktop archive
        run: python packaging/nuitka/build_windows_desktop.py --engine engine --desktop desktop --output delivery
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-0.17.9-windows-x86_64
          path: |
            delivery/wx-doc-format-0.17.9-windows-x86_64.zip
            delivery/SHA256SUMS.txt
            delivery/acceptance.json
          if-no-files-found: error
          retention-days: 14
